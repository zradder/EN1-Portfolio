<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Realistic mountain field landscape</title>
  <desc id="desc">A realistic mountain valley scene with layered peaks, softer cloud shadows, and a textured green field.</desc>

  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#eaf9ff"/>
      <stop offset="18%" stop-color="#d8f0ff"/>
      <stop offset="48%" stop-color="#c7dffb"/>
      <stop offset="75%" stop-color="#d9b889"/>
      <stop offset="100%" stop-color="#f2d39a"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="70%" cy="18%" r="35%">
      <stop offset="0%" stop-color="#fffbe7" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#fff2b5" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fff2b5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mountainFar" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#acc0ce"/>
      <stop offset="100%" stop-color="#6a7d8a"/>
    </linearGradient>
    <linearGradient id="mountainMid" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#738c9d"/>
      <stop offset="100%" stop-color="#3a4f61"/>
    </linearGradient>
    <linearGradient id="mountainFront" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#3c5668"/>
      <stop offset="100%" stop-color="#1b2f3f"/>
    </linearGradient>
    <linearGradient id="field" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#c5e27a"/>
      <stop offset="24%" stop-color="#9acb60"/>
      <stop offset="100%" stop-color="#486f39"/>
    </linearGradient>
    <linearGradient id="fieldHighlight" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#8fbf58"/>
      <stop offset="100%" stop-color="#467242"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1210" cy="180" r="150" fill="url(#sunGlow)"/>

  <g opacity="0.8">
    <g fill="#ffffff">
      <ellipse cx="220" cy="175" rx="120" ry="26"/>
      <ellipse cx="335" cy="185" rx="160" ry="34"/>
      <ellipse cx="690" cy="150" rx="130" ry="30"/>
      <ellipse cx="845" cy="175" rx="170" ry="36"/>
      <ellipse cx="1180" cy="150" rx="150" ry="32"/>
      <ellipse cx="1330" cy="190" rx="200" ry="40"/>
    </g>
    <g fill="#edf8ff" opacity="0.7">
      <ellipse cx="310" cy="130" rx="90" ry="18"/>
      <ellipse cx="1220" cy="120" rx="100" ry="20"/>
    </g>
  </g>

  <path d="M0,520 L160,390 L280,495 L440,330 L620,510 L800,360 L960,525 L1110,300 L1280,530 L1600,330 L1600,900 L0,900 Z" fill="url(#mountainFar)" opacity="0.95"/>
  <path d="M0,610 L150,470 L320,625 L500,395 L700,630 L890,420 L1110,640 L1290,470 L1600,620 L1600,900 L0,900 Z" fill="url(#mountainMid)"/>
  <path d="M0,700 L180,530 L290,625 L440,480 L560,700 L770,500 L1030,700 L1180,520 L1390,710 L1600,600 L1600,900 L0,900 Z" fill="url(#mountainFront)"/>

  <g opacity="0.25">
    <path d="M560,440 L760,330 L930,450 L1090,350 L1270,470 L1285,520 L560,520 Z" fill="#dfeaf1"/>
    <path d="M0,630 L250,520 L470,620 L600,560 L780,620 L935,530 L1108,620 L1290,560 L1600,640 L1600,700 L0,700 Z" fill="#dfeaf1"/>
  </g>

  <path d="M0,695 C180,640 350,660 520,680 C675,698 860,650 1030,678 C1185,705 1360,740 1600,700 L1600,900 L0,900 Z" fill="url(#field)"/>
  <path d="M0,760 C130,718 285,746 445,735 C610,724 770,776 962,743 C1148,710 1330,770 1600,729 L1600,900 L0,900 Z" fill="url(#fieldHighlight)" opacity="0.9"/>

  <g stroke="#2f5d32" stroke-width="2" opacity="0.48" fill="none">
    <path d="M70,760 C110,738 122,730 130,760"/>
    <path d="M210,760 C245,736 260,726 272,760"/>
    <path d="M350,770 C370,750 385,742 398,770"/>
    <path d="M520,770 C550,740 570,734 592,770"/>
    <path d="M710,780 C742,750 756,744 772,780"/>
    <path d="M960,772 C994,742 1016,736 1036,772"/>
    <path d="M1178,778 C1212,748 1232,742 1258,778"/>
    <path d="M1368,770 C1408,748 1436,740 1458,770"/>
  </g>

  <g fill="#265231" opacity="0.92">
    <path d="M100,770 L120,720 L140,770 Z"/>
    <path d="M180,772 L208,695 L236,772 Z"/>
    <path d="M1388,774 L1415,708 L1442,774 Z"/>
    <path d="M1460,774 L1495,682 L1530,774 Z"/>
  </g>

  <g fill="#8dbd59" opacity="0.8">
    <path d="M0,845 C320,822 540,875 790,848 C1040,816 1300,876 1600,850 L1600,900 L0,900 Z"/>
  </g>

  <g opacity="0.15" filter="url(#softBlur)">
    <path d="M0,760 C260,700 500,790 760,782 C1010,774 1225,832 1600,794 L1600,900 L0,900 Z" fill="#ffffff"/>
  </g>
</svg>
